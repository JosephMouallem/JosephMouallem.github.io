# Navigation Links
#   To link a homepage section, specify the URL as a hash `#` followed by the
#     `id` of the desired section in `content/_index.md`.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: '#about'
    weight: 10
  - name: Focus Areas
    url: '#focus'
    weight: 20
  - name: Positions
    url: '#experience'
    weight: 30
  - name: Publications
    url: '#featured'
    weight: 40
  - name: Contact
    url: '#contact'
    weight: 50
  - name: CV
    url: uploads/resume.pdf
    weight: 60
